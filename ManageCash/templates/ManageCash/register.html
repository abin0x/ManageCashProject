{% extends 'ManageCash/base.html' %}
{% block title %}Create account{% endblock %}
{% block content_auth %}
<h1>Create your account</h1>
<p class="text-muted mb-4">Start managing your cash in under a minute.</p>
<form method="post">
    {% csrf_token %}
    {% include 'ManageCash/_form_fields.html' %}
    <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Create account <i class="bi bi-arrow-right ms-1"></i></button>
</form>
<p class="text-center text-muted mt-4 mb-0 small">
    Already have an account? <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">Log in</a>
</p>
{% endblock %}
