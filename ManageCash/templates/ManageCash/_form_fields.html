{% if form.non_field_errors %}
    <div class="form-errors"><i class="bi bi-exclamation-circle me-1"></i>{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
    <div class="form-field field-{{ field.name }}{% if field.errors %} has-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="text-muted fw-normal">(optional)</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<small class="helptext">{{ field.help_text|safe }}</small>{% endif %}
        {{ field.errors }}
    </div>
{% endfor %}
